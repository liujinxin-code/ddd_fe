# 部署 DDD.FE API（.NET 8）
# API 直接连接「宿主机原生」MySQL(库名 ddd_flowenginedb) 与 Redis。
# 容器版 mysql/redis 已不再被 compose 管理，但容器本身保留（未删除）。
# 用法（仓库根目录）：docker compose up -d --force-recreate api
#
# 说明：
#  - api 容器内仅暴露 http :8080，TLS 建议由前置 nginx 终结。
#  - 上传图片持久化到命名卷 uploads（/app/wwwroot/images）。
#  - 通过 extra_hosts 把 host.docker.internal 指向宿主机网关，容器内以此访问宿主机服务。
#  - appsettings.json 已被 .dockerignore 排除，以下 Section__Key 环境变量即为运行时真实配置。

services:
  api:
    build: ./publish          # 单阶段运行时镜像：复用本地已发布的 Linux 程序集，仅依赖已缓存的 aspnet:8.0
    image: ddd-api:latest
    # 如需固定镜像名可用 image: ddd-api:latest 代替 build
    ports:
      - "9080:8080"          # 宿主机:容器；生产可改为 80:8080 并由 nginx 反代
    # 容器内通过 host.docker.internal 访问宿主机原生 MySQL/Redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 以下参数对齐项目 appsettings.json（容器内 DB/Redis 主机由 127.0.0.1 改为 host.docker.internal 以访问宿主机原生服务）
      - "DbOptions__ConnectionString=Server=host.docker.internal;Port=3306;Database=ddd_flowenginedb;User=root;Password=qwer1234ASDF!@#;AllowUserVariables=true;CharSet=utf8mb4;SslMode=none;AllowPublicKeyRetrieval=True"
      - "RedisOptions__ConnectionString=host.docker.internal:6379,abortConnect=false,connectTimeout=60000,ssl=false"
      - JwtSettings__Issuer=FlowEngine
      - JwtSettings__Audience=FlowEngine.Web
      - JwtSettings__SecretKey=FlowEngine.Jwt.SecretKey.Tk.User.2026
      - PasswordOptions__Salt=SaltAXCLEW
      - FileSettings__BaseUrl=http://49.234.58.209:9080
      - FileSettings__MaxFileCount=10
      # 滑动窗口限流（详见 RateLimitOptions；authorized=200次/30s，按 userid:jti 计）
      - RateLimit__AuthorizedLimit=200
      - RateLimit__AuthorizedWindowSeconds=30
      - RateLimit__AnonymousLimit=60
      - RateLimit__AnonymousWindowSeconds=30
      - RateLimit__EnableAnonymous=true
      - RateLimit__UnauthenticatedLimit=20
      - RateLimit__UnauthenticatedWindowSeconds=30
    volumes:
      - uploads:/app/wwwroot/images
    restart: unless-stopped

  # 前端静态站点（Vue3 SPA）：nginx:alpine 直接挂载 dist，映射宿主机 80
  web:
    image: nginx:alpine
    ports:
      - "80:80"               # 宿主机:容器；80 已在云防火墙放开
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  uploads:
